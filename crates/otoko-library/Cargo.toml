[package]
name = "otoko-library"
description = "La base d'Otoko Studio Vault Pro : morceaux, sorties, projets, import de Studio Vault"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde_json = "1"
regex = "1"
lofty = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
walkdir = "2"
