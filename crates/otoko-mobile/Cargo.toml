[package]
name = "otoko-mobile"
description = "Serveur d'Otoko Vault : la bibliothèque servie au téléphone (Tailscale, Wi-Fi), liens de partage publics"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
otoko-library = { path = "../otoko-library" }
rusqlite = { version = "0.41", features = ["bundled", "functions", "fallible_uint"] }
serde_json = "1"
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "ogg", "vorbis", "wav", "pcm", "aiff"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = "0.2"
base64 = "0.22"
